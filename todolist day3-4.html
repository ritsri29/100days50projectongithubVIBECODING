
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow | Smart To-Do</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: #080d18;
    color: #f1f5f9;
    min-height: 100vh;
    padding: 35px 16px;
}

.container {
    max-width: 760px;
    margin: auto;
}

header {
    margin-bottom: 30px;
}

.logo {
    color: #38bdf8;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

h1 {
    font-size: 35px;
    margin-bottom: 8px;
}

.subtitle {
    color: #94a3b8;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 25px;
}

.stat {
    background: #111a2b;
    padding: 19px;
    border: 1px solid #243047;
    border-radius: 13px;
}

.stat p {
    color: #94a3b8;
    font-size: 12px;
    margin-bottom: 9px;
}

.stat h2 {
    font-size: 26px;
}

.progress-card, .task-panel {
    background: #111a2b;
    border: 1px solid #243047;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 20px;
}

.progress-heading {
    display: flex;
    justify-content: space-between;
    margin-bottom: 13px;
    font-size: 14px;
}

.progress-bar {
    height: 9px;
    background: #263449;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0ea5e9, #38bdf8);
    transition: width .3s;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

input {
    min-width: 0;
    flex: 1;
    padding: 15px;
    border: 1px solid #334155;
    border-radius: 10px;
    background: #080d18;
    color: white;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #38bdf8;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 9px;
    padding: 12px 17px;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    opacity: .85;
    transform: translateY(-1px);
}

.add-btn {
    background: #0284c7;
    color: white;
}

.filters {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}

.filter {
    background: #1e293b;
    color: #cbd5e1;
    font-size: 12px;
}

.filter.active {
    background: #0284c7;
    color: white;
}

.task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    border-bottom: 1px solid #263449;
}

.task:last-child {
    border-bottom: none;
}

.task input[type="checkbox"] {
    flex: none;
    width: 18px;
    height: 18px;
    accent-color: #0ea5e9;
}

.task-title {
    flex: 1;
    overflow-wrap: anywhere;
    font-size: 14px;
}

.task.completed .task-title {
    text-decoration: line-through;
    color: #64748b;
}

.actions {
    display: flex;
    gap: 6px;
}

.actions button {
    padding: 8px 10px;
    font-size: 12px;
}

.edit-btn {
    background: #1e40af;
    color: white;
}

.delete-btn {
    background: #7f1d1d;
    color: white;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 35px 10px;
}

footer {
    color: #64748b;
    font-size: 12px;
    text-align: center;
    margin-top: 25px;
}

@media(max-width: 500px) {
    h1 { font-size: 29px; }
    .stats { gap: 7px; }
    .stat { padding: 13px; }
    .stat h2 { font-size: 21px; }
    .actions button { padding: 8px; }
    .input-area { flex-wrap: wrap; }
    .add-btn { width: 100%; }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">TASKFLOW / 002</div>
    <h1>Smart To-Do App</h1>
    <p class="subtitle">Plan your work. Complete your goals.</p>
</header>

<section class="stats">
    <div class="stat">
        <p>Total Tasks</p>
        <h2 id="total">0</h2>
    </div>
    <div class="stat">
        <p>Pending</p>
        <h2 id="pending">0</h2>
    </div>
    <div class="stat">
        <p>Completed</p>
        <h2 id="completed">0</h2>
    </div>
</section>

<section class="progress-card">
    <div class="progress-heading">
        <strong>Daily Progress</strong>
        <span id="percentage">0%</span>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>
</section>

<section class="task-panel">

    <div class="input-area">
        <input id="taskInput"
               type="text"
               placeholder="What needs to be done?"
               maxlength="150">
        <button class="add-btn" id="addBtn">+ Add Task</button>
    </div>

    <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="pending">Pending</button>
        <button class="filter" data-filter="completed">Completed</button>
    </div>

    <div id="taskList"></div>

</section>

<footer>
    TASKFLOW © 2026 · Powered by JavaScript & LocalStorage
</footer>

</div>

<script>
const STORAGE_KEY = "taskflow_tasks";

let tasks = [];

try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    tasks = Array.isArray(saved)
        ? saved.filter(t =>
            t &&
            typeof t.id === "string" &&
            typeof t.title === "string" &&
            typeof t.completed === "boolean"
          )
        : [];
} catch {
    tasks = [];
}

let currentFilter = "all";

const taskInput = document.getElementById("taskInput");
const taskList = document.getElementById("taskList");

function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

function addTask() {
    const title = taskInput.value.trim();

    if (!title) {
        taskInput.focus();
        return;
    }

    tasks.unshift({
        id: crypto.randomUUID(),
        title,
        completed: false
    });

    taskInput.value = "";
    saveTasks();
    render();
    taskInput.focus();
}

function editTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    const updated = prompt("Edit your task:", task.title);

    if (updated === null) return;

    if (!updated.trim()) {
        alert("Task cannot be empty.");
        return;
    }

    task.title = updated.trim().slice(0, 150);
    saveTasks();
    render();
}

function deleteTask(id) {
    if (!confirm("Are you sure you want to delete this task?")) {
        return;
    }

    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    render();
}

function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    task.completed = !task.completed;
    saveTasks();
    render();
}

function render() {
    const total = tasks.length;
    const completed = tasks.filter(t => t.completed).length;
    const pending = total - completed;

    const percent = total
        ? Math.round(completed / total * 100)
        : 0;

    document.getElementById("total").textContent = total;
    document.getElementById("pending").textContent = pending;
    document.getElementById("completed").textContent = completed;
    document.getElementById("percentage").textContent = percent + "%";
    document.getElementById("progress").style.width = percent + "%";

    const visibleTasks = tasks.filter(task => {
        if (currentFilter === "pending") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
    });

    taskList.replaceChildren();

    if (!visibleTasks.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = total
            ? "No tasks in this category."
            : "No tasks yet. Add your first task!";
        taskList.appendChild(empty);
        return;
    }

    visibleTasks.forEach(task => {
        const row = document.createElement("div");
        row.className = "task" + (task.completed ? " completed" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Complete " + task.title);
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const title = document.createElement("span");
        title.className = "task-title";
        title.textContent = task.title;

        const actions = document.createElement("div");
        actions.className = "actions";

        const edit = document.createElement("button");
        edit.className = "edit-btn";
        edit.textContent = "Edit";
        edit.addEventListener("click", () => editTask(task.id));

        const remove = document.createElement("button");
        remove.className = "delete-btn";
        remove.textContent = "Delete";
        remove.addEventListener("click", () => deleteTask(task.id));

        actions.append(edit, remove);
        row.append(checkbox, title, actions);
        taskList.appendChild(row);
    });
}

document.getElementById("addBtn").addEventListener("click", addTask);

taskInput.addEventListener("keydown", event => {
    if (event.key === "Enter") addTask();
});

document.querySelectorAll(".filter").forEach(button => {
    button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        document.querySelectorAll(".filter").forEach(btn => {
            btn.classList.toggle("active", btn === button);
        });

        render();
    });
});

render();
</script>

</body>
</html>
